[project]
name = "cross-read"
version = "0.1.0"
description = "A read-only Windows desktop and LAN file reader"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0.0",
    "pytest>=8.4.0,<9.0.0",
    "pytest-cov>=6.2.0,<7.0.0",
    "ruff>=0.12.0,<1.0.0",
]
desktop = [
    "pyinstaller>=6.14.0,<7.0.0",
    "pystray>=0.19.5,<1.0.0",
    "pywebview>=5.4,<6.0.0",
    "pillow>=11.3.0,<12.0.0",
]

[project.scripts]
cross-read = "cross_read.cli:main"
cross-read-desktop = "cross_read.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cross_read"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
